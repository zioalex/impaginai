# Has an API key ever been committed to this repository?
#
# The pre-push hook and `detect-secrets` guard what is about to be committed.
# Neither says anything about the commits made before they existed, and this
# project has handled live keys since its first week. Removing a key from
# history is cheap while few people have cloned and expensive afterwards, so
# the question is worth asking on a schedule rather than once.
#
# tools/scan_history_for_secrets.py reads every blob reachable from every
# branch and tag — including commits no branch points at any more — and exits
# 1 on anything shaped like a key that is not one of the test fixtures. Its
# own test (tools/test_scan_history_for_secrets.py) runs first, so a scanner
# that has stopped detecting anything fails here instead of passing.
#
# A full clone is required: a shallow one would pass by not having the data.
name: Secrets in history
on:
  schedule:
    - cron: "23 7 * * 1"      # Monday
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/scan_history_for_secrets.py"
      - "tools/test_scan_history_for_secrets.py"
      - ".github/workflows/secrets-history.yml"

permissions:
  contents: read

concurrency:
  group: secrets-history-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # every commit, or the scan means nothing

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test the scanner
        run: |
          pip install pytest
          python -m pytest tools/test_scan_history_for_secrets.py -q

      - name: Scan every blob in history
        run: python tools/scan_history_for_secrets.py
