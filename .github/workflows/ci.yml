# Three things, on every push: do the dependencies have known holes, does the
# code have mistakes a linter can see, and does the print chain still work. The second matters because the Chromium scaling bug
# documented in phase0/README.md was invisible except in the rendered output.
name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"      # Monday: catch advisories published since the last push

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Names that do not exist, unused imports, syntax errors: see pyproject.toml.
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Warm the offline geocoder
        run: python -c "import reverse_geocoder as rg; rg.search([(47.4, 8.6)])"
      # Planner loop, page repacker, the editor over HTTP and in Chromium, all
      # against a fake model (mocked key, no network). Each check is reported
      # on its own, and the coverage table lands in the run's summary.
      - name: Tests
        run: pytest --cov --cov-report=term --cov-report=markdown:coverage.md
      - name: Coverage summary
        if: always()
        run: test -f coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Calibration book renders to spec
        run: |
          cd phase0
          python tools/make_placeholder_photos.py
          python render.py proof --layout examples/layout_test24.json \
                 --photos ./photos --allow-fold --out /tmp/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-pdf
          path: /tmp/out/inner-proof.pdf
          if-no-files-found: ignore
