# Captions for the demo photo set. One line per photo — the only data entry
# the user does.
p001: Der erste Blick auf die Bucht, kurz nach der Ankunft
p002: Sie steht lange am Rand und schaut hinunter
p003: Mittagslicht auf dem Wasser
p004: Ein Muster an der Mauer, das wir nicht erklären konnten
p005: Der Wind kam erst am Nachmittag
p006: Morgens im Hafen, bevor die Boote auslaufen
p007: Die Gasse hinter der Kirche, immer im Schatten
p008: Detail einer Tür
p009: Weiß auf Weiß, das ganze Dorf
p010: Er wartet auf den Kaffee
p011: Santa Maria, geschlossen wie immer
p012: Kacheln, blau und weiß
p013: Noch mehr Kacheln — wir konnten nicht aufhören
p014: Der Glockenturm von unten
p015: Sie hat den ganzen Weg nach oben geschafft
p016: Ein kleines Boot, weit draußen
p017: Letzter Abend, das Licht ging schnell
p018: Die Bucht noch einmal, jetzt ganz anders
p019: Salz auf der Haut
p020: Niemand wollte zurück
p021: Muscheln, gesammelt und wieder zurückgelegt
p022: Das Meer wurde ruhig, als wir gingen
