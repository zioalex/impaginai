# Metadata and tool configuration. The project is still not built as a wheel
# (there is no [build-system] table; see
# docs/reviews/2026-11-11-project-review.md), but the licence belongs here so
# anything reading this file knows the terms. The rest of the file exists so the
# test runner, the linter and the coverage report agree on what the code is.

[project]
name = "impaginai"
version = "0.1.0"
description = "Turns a folder of photographs into a print-ready photo book."
requires-python = ">=3.11"
# The licence is an SPDX expression (PEP 639): AGPL-3.0 version 3 exactly, not
# "or later". A commercial licence is available as well, see COMMERCIAL.md.
license = "AGPL-3.0-only"
# The lab specification files under phase0/labs/ stay Apache-2.0.
license-files = ["LICENSE", "phase0/labs/LICENSE"]
authors = [{ name = "Alessandro Surace" }]

[tool.pytest.ini_options]
testpaths = ["phase1/tests"]
pythonpath = ["phase0", "phase1", "phase2", "phase1/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["albums", "phase0/photos"]

[tool.ruff.lint]
# Real mistakes only: names that do not exist, imports and variables nobody
# uses, syntax errors, comparisons that are always true. Style is not checked.
select = ["F", "E9", "E7", "PLE", "B006", "B008", "B018"]
ignore = ["E731", "E741", "E701", "E702"]

[tool.coverage.run]
source = ["phase0", "phase1", "phase2"]
omit = ["phase1/tests/*", "phase*/tools/*"]
# The end-to-end and browser tests run the editor and the command line as
# separate processes; without this their lines would count as never run.
patch = ["subprocess"]
parallel = true
# The editor is stopped with SIGTERM; without this its data is never written.
sigterm = true

[tool.coverage.report]
# 84% when this was added. The floor is there to notice a module losing its
# tests, not as a target.
fail_under = 80
skip_empty = true
sort = "cover"
