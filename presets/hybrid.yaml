# HYBRID — RECOMMENDED for a 24 GB GPU. Local eyes, cloud judgement.
#
# Annotation runs on your own machine: it is the call that dominates token
# cost (images are expensive, and there is one per 8 photographs), it is the
# only call that touches your actual photographs, and it is cached after the
# first run. Planning is a single text call where judgement decides whether the
# book is any good, so that one is worth paying for.
#
# Cost for a 100-photograph album with three revisions: about $0.29
#   annotate $0.00 (local) + plan $0.07 + three revisions $0.22
#
# With annotation local, REVISIONS become the whole bill: each one is a full
# planning-sized call and you will make several. Dropping the revise role to
# Haiku takes the album to $0.08 — see the note under `revise` below.
#
# Your photographs never leave the house either way: only the planner and the
# reviser see text, never an image.
#
#   ollama pull qwen3-vl:32b
#   python phase2/server.py --album ./albums/x --photos ~/Pictures/x \
#          --models presets/hybrid.yaml
#
# Needs: OPENROUTER_API_KEY. Ollama needs no key.

default:
  base_url: openrouter
  model: anthropic/claude-sonnet-5.5
  json_mode: true

annotate:
  base_url: ollama
  model: qwen3-vl:32b          # ~21 GB at Q4; leaves headroom for image spikes
  # Alternatives if this disappoints:
  #   gemma4:31b          ~20 GB, strongest vision benchmarks of this tier
  #   gemma3:27b          ~14 GB int4 QAT, most headroom, still good
  #   qwen3-vl:8b         ~7 GB, if you want the GPU free for other work

plan:
  model: anthropic/claude-sonnet-5.5
  # Reasoning models can think until the output budget is gone and then
  # write nothing; `low` keeps that in check and the larger budget leaves room
  # for a full layout either way.
  reasoning: low
  max_tokens: 32000
  # Used only after the primary has clearly failed (endpoint down, unknown
  # model, still empty after a retry) — never to second-guess an answer. A
  # different vendor, because an outage rarely hits two at once.
  fallback_model: google/gemini-4-argon

revise:
  model: anthropic/claude-sonnet-5.5
  # Worth trying: anthropic/claude-haiku-5.5 takes the album from $0.29 to
  # $0.08, because three revisions at Sonnet cost more than everything else
  # combined. A revision is obedience rather than invention — the whole layout
  # is in context and one thing is being changed — so a small model can do it.
  #
  # The risk is real though: the model must re-emit the ENTIRE layout, and a
  # weak one can quietly disturb spreads you did not ask about. Version history
  # and rollback make that recoverable, and `change_summary` tells you what it
  # thinks it did. Try it, read one summary, and keep it if it behaves.
  # Reasoning models can think until the output budget is gone and then
  # write nothing; `low` keeps that in check and the larger budget leaves room
  # for a full layout either way.
  reasoning: low
  max_tokens: 32000
  # Used only after the primary has clearly failed (endpoint down, unknown
  # model, still empty after a retry) — never to second-guess an answer. A
  # different vendor, because an outage rarely hits two at once.
  fallback_model: google/gemini-4-argon
