# SPDX-FileCopyrightText: 2026 Alessandro Surace
# SPDX-License-Identifier: AGPL-3.0-only
#
# Licensing for the files that do not carry their own SPDX header, so that
# `reuse lint` passes and every file in the repository has a machine-readable
# licence. See <https://reuse.software/spec-3.3/>.
#
# Why this file exists rather than headers everywhere: the files below either
# cannot hold a comment (JPEG, JSON), are regenerated by a tool that would
# delete the header (the `requirements*.lock.txt` files, see AGENTS.md), are
# copied by users into their own album directories (where stamping the
# project's licence on their copy would be misleading), or are prose, where a
# header above the first heading is noise. Everything that is source and can
# hold a comment carries its own two SPDX lines instead.
#
# The licence of the code itself is AGPL-3.0-only and is declared in each
# source file and in pyproject.toml, not here.

version = 1
SPDX-PackageName = "impaginai"
SPDX-PackageSupplier = "Alessandro Surace <https://github.com/zioalex>"
SPDX-PackageDownloadLocation = "https://github.com/zioalex/impaginai"

# Documentation and prose. CC-BY-SA-4.0: a licence written for text rather than
# for software, so it says something sensible about attribution and adaptation,
# and keeps the share-alike spirit of the code. `override` is deliberate: these
# files quote other people's copyright notices (README.md credits OpenStreetMap)
# and the scanner would otherwise read one of those as the file's own.
[[annotations]]
path = [
    "README.md",
    "PLAN.md",
    "RUNNING.md",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "CLA.md",
    "COMMERCIAL.md",
    "docs/**",
    "phase0/README.md",
    "phase1/README.md",
    "phase2/README.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Alessandro Surace"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Configuration a user copies into their own album directory. CC0-1.0, so what
# they end up with is theirs: a copyleft notice on a config file somebody
# copied and edited would claim more than the project means to claim. These
# files are left without headers on purpose for the same reason.
[[annotations]]
path = [
    "presets/*.yaml",
    "models.example.yaml",
    "phase1/examples/*.yaml",
]
SPDX-FileCopyrightText = "2026 Alessandro Surace"
SPDX-License-Identifier = "CC0-1.0"

# Part of the program, but unable to carry a header: the dependency lists are
# rewritten by `uv pip compile`, the layout fixture is JSON, and the demo
# photographs are JPEGs generated by phase1/tools/make_demo_photos.py and
# committed so a fresh clone runs end to end.
[[annotations]]
path = [
    "requirements.txt",
    "requirements-dev.txt",
    "requirements.lock.txt",
    "requirements-dev.lock.txt",
    "phase0/examples/*.json",
    "phase1/demo_photos/*.jpg",
]
SPDX-FileCopyrightText = "2026 Alessandro Surace"
SPDX-License-Identifier = "AGPL-3.0-only"
