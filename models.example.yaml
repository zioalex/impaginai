# Copy to models.yaml and pass with --models models.yaml
#
# Why split the roles at all: the three calls are different jobs.
#
#   annotate  one call per 8 photographs, needs VISION, cached after the first
#             run, and a mediocre answer barely affects the layout
#             -> cheapest or local. Free on your own GPU.
#   plan      exactly one call, no vision, must obey a ~9,000-character brief,
#             and its quality is the album's quality
#             -> the best model you are willing to pay for. One call, so cents.
#   revise    one call per comment, no vision, targeted edit to an existing
#             layout
#             -> mid-tier is fine.
#
# A role inherits anything it does not set from `default`.

default:
  base_url: openrouter
  model: anthropic/claude-sonnet-5.5
  # api_key: sk-or-...        # better: export OPENROUTER_API_KEY
  # price_in: 3.0             # USD per million tokens, for the editor's cost line,
  # price_out: 15.0           # when the model is not in providers.PRICES (OpenRouter
  #                           # reports the real cost itself; local models are free)

annotate:
  base_url: ollama            # http://localhost:11434/v1 — no key needed
  model: qwen3-vl:32b

plan:
  model: anthropic/claude-opus-5.5
  json_mode: true             # OpenAI-compatible endpoints only
  # Optional, per role or in `default`:
  # max_tokens: 32000         # output budget per call (default 16000)
  # reasoning: low            # default | low | off | high. Reasoning models can think
  #                           # until the budget is gone and return nothing;
  #                           # `off` is for Ollama (thinking + JSON = empty).
  # fallback_model: google/gemini-4-argon   # tried once, only after the
  #                           # primary has clearly failed; pick another vendor
  # fallback_base_url: openrouter           # only if it lives elsewhere

# revise: inherits default

# ---------------------------------------------------------------------------
# Cheaper variants. Measured cost for a 100-photograph album with three
# revisions, so you can see what you are actually trading:
#
#   opus-5.5 everywhere ............ $1.12
#   sonnet-5.5 everywhere .......... $0.56
#   haiku-5.5 everywhere ........... $0.028
#   glm-5.3-flash everywhere ....... $0.010
#   local annotate + sonnet plan ... $0.07
#   everything local ............... $0.00
#
# A print costs CHF 40-100, so cost is not the reason to choose. Benchmark
# candidates first:  python phase1/tools/bench_model.py --compare A B C
#
# Cheap and hosted:
#   default: {base_url: openrouter, model: anthropic/claude-haiku-5.5}
#
# Cheapest and most private — everything on your own GPU:
#   default: {base_url: ollama, model: qwen3-vl:32b}
#
# The best value: annotate locally (it dominates the cost, because images are
# expensive), spend only on the single planning call that decides the result.
#   default: {base_url: ollama,     model: qwen3-vl:32b}
#   plan:    {base_url: openrouter, model: anthropic/claude-sonnet-5.5, json_mode: true}
